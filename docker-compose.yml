version: '3.8'

services:
  web:
    image: php:8.2-apache
    container_name: calculando_a_sorte_web
    restart: always
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      - DB_HOST=db
      - DB_NAME=calculando_a_sorte
      - DB_USER=root
      - DB_PASS=root
    command: >
      bash -c "docker-php-ext-install pdo pdo_mysql &&
               apache2-foreground"
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: calculando_a_sorte_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: calculando_a_sorte
    ports:
      - "3307:3306"
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - db_data:/var/lib/mysql

volumes:
  db_data:
